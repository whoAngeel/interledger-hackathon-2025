services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interledger-backend
    ports:
      - "4001:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-interledger-redis-secret}
      - MONGO_URI=mongodb://mongo:27017/openpayments
      - WALLET_ADDRESS_URL=${WALLET_ADDRESS_URL}
      - KEY_ID=${KEY_ID}
      - PRIVATE_KEY_PATH=/app/dev.key
      - FRONTEND_URL=https://interledger.whoangel.work
      - CALLBACK_BASE_URL=https://interledger.whoangel.work
    volumes:
      - ./dev.key:/app/dev.key:ro
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - interledger-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: interledger-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-interledger-redis-secret} --save 60 1 --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - interledger-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-interledger-redis-secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  mongo:
    image: mongo:7
    container_name: interledger-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - interledger-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  interledger-net:
    driver: bridge

volumes:
  redis-data:
  mongo-data:
